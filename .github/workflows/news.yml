name: Archive news and market event reactions
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Update MOVENT markets']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: movent-news-data
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_news*.py' -v
      - run: python scripts/news_research.py
      - name: Preserve articles, corrections and observations
        run: |
          git config user.name 'movent-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/news data/history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: archive news and event observations'
          git pull --rebase origin main
          git push origin HEAD:main
